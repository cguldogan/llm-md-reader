name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          xcodebuild -project MarkdownReader.xcodeproj \
            -scheme MarkdownReader \
            -destination 'platform=macOS' \
            -derivedDataPath .build \
            test
